<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Трекер заказов</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font:15px Segoe UI,Arial}header{background:linear-gradient(135deg,#4e5bea,#8064e9);color:#fff;padding:30px 6vw 75px}h1{margin:0 0 8px}.wrap{max-width:1100px;margin:-45px auto 40px;padding:0 18px}.card{background:#fff;border-radius:18px;padding:22px;margin-bottom:20px;box-shadow:0 10px 30px #34457512}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.search{flex:1;min-width:250px}input,select,textarea{width:100%;padding:11px 13px;border:1px solid #e5e9f1;border-radius:10px;font:inherit}button{padding:11px 16px;border:0;border-radius:10px;font-weight:600;cursor:pointer}.primary{background:#5966ed;color:white}.ghost{background:#eef0ff;color:#5966ed}.danger{background:#fff0f1;color:#d34d5a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{border:1px solid #e7ebf3;border-radius:12px;padding:16px}.stat b{display:block;font-size:26px}.head,.row{display:grid;grid-template-columns:1.2fr 1.3fr 1fr 1fr 1.2fr;gap:14px;align-items:center}.head{font-size:11px;color:#718096;text-transform:uppercase;padding:0 10px 10px}.row{border-top:1px solid #e7ebf3;padding:16px 10px}.muted{color:#718096}.status{padding:6px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}.new{background:#edf0ff;color:#5260dd}.processing{background:#fff4e4;color:#c27a1e}.shipped{background:#e8f8f2;color:#148561}.delivered{background:#e9f7ec;color:#25823d}.thumbs{display:flex;gap:5px;margin-top:7px}.thumb{width:34px;height:34px;object-fit:cover;border-radius:6px;cursor:pointer}.modal-bg,.viewer{position:fixed;inset:0;background:#17203380;display:none;align-items:center;justify-content:center;padding:18px;z-index:3}.modal{background:white;border-radius:18px;padding:24px;width:min(570px,100%)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.field label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.file{padding:13px;border:1px dashed #aeb8ce;border-radius:10px;text-align:center;cursor:pointer}.viewer img{max-width:92vw;max-height:88vh}.empty{text-align:center;padding:38px;color:#718096}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.head{display:none}.row{grid-template-columns:1fr 1fr}.row>div:last-child{grid-column:1/-1}.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header><h1>📦 Трекер заказов</h1><div>Поиск заказов и фотографии хранятся на компьютере</div></header><main class="wrap"><section class="card"><div class="stats"><div class="stat"><b id="total">0</b>Всего заказов</div><div class="stat"><b id="active">0</b>В работе</div><div class="stat"><b id="photos">0</b>Фотографий</div></div></section><section class="card"><div class="toolbar"><div class="search"><input id="q" placeholder="Поиск по номеру заказа..."></div><select id="filter" style="max-width:180px"><option value="all">Все статусы</option><option value="new">Новый</option><option value="processing">В обработке</option><option value="shipped">В пути</option><option value="delivered">Доставлен</option></select><button class="primary" onclick="openForm()">＋ Добавить заказ</button></div></section><section class="card"><div class="head"><div>Номер</div><div>Клиент</div><div>Дата</div><div>Статус</div><div>Фото / действие</div></div><div id="list"></div></section></main><div class="modal-bg" id="bg"><form class="modal" onsubmit="save(event)"><h2>Новый заказ</h2><div class="fields"><div class="field"><label>Номер заказа *</label><input name="number" required placeholder="ORD-1001"></div><div class="field"><label>Клиент</label><input name="customer"></div><div class="field"><label>Дата</label><input name="date" type="date"></div><div class="field"><label>Статус</label><select name="status"><option value="new">Новый</option><option value="processing">В обработке</option><option value="shipped">В пути</option><option value="delivered">Доставлен</option></select></div><div class="field full"><label>Описание</label><textarea name="description" rows="2"></textarea></div><div class="field full"><label>Фотографии заказа</label><label class="file">📷 Выбрать фотографии<input id="files" name="photos" type="file" accept="image/*" multiple hidden></label><small class="muted" id="chosen">Файлы сохранятся в папку uploads/номер-заказа</small></div></div><div class="actions"><button type="button" class="ghost" onclick="closeForm()">Отмена</button><button class="primary">Сохранить</button></div></form></div><div class="viewer" id="viewer" onclick="this.style.display='none'"><img id="big"></div><script>
let orders=[],labels={new:'Новый',processing:'В обработке',shipped:'В пути',delivered:'Доставлен'};const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){orders=await fetch('/api/orders').then(r=>r.json());render()}function render(){let q=$('q').value.toLowerCase(),f=$('filter').value,a=orders.filter(o=>(!q||o.number.toLowerCase().includes(q))&&(f==='all'||o.status===f));$('total').textContent=orders.length;$('active').textContent=orders.filter(o=>o.status!=='delivered').length;$('photos').textContent=orders.reduce((n,o)=>n+o.photos.length,0);$('list').innerHTML=a.length?a.map(o=>`<div class="row"><div><b>${esc(o.number)}</b><br><small class="muted">${o.photos.length?'📷 '+o.photos.length+' фото':'Без фото'}</small></div><div>${esc(o.customer||'—')}<br><small class="muted">${esc(o.description||'')}</small></div><div>${esc(o.date||'—')}</div><div><span class="status ${o.status}">${labels[o.status]}</span></div><div><button class="danger" onclick="removeOrder('${o.id}')">Удалить</button>${o.photos.length?'<div class="thumbs">'+o.photos.map(p=>`<img class="thumb" src="${p}" onclick="show('${p}')">`).join('')+'</div>':''}</div></div>`).join(''):'<div class="empty">Заказы не найдены. Добавь первый заказ!</div>'}function openForm(){$('bg').style.display='flex';$('bg').querySelector('form').reset();$('chosen').textContent='Файлы сохранятся в папку uploads/номер-заказа'}function closeForm(){$('bg').style.display='none'}$('files').onchange=e=>$('chosen').textContent=e.target.files.length+' файл(ов) выбрано';async function save(e){e.preventDefault();let form=e.target,d=new FormData(form),r=await fetch('/api/orders',{method:'POST',body:d}),x=await r.json();if(!r.ok)return alert(x.error);closeForm();load()}async function removeOrder(id){if(confirm('Удалить заказ и его фотографии?')){await fetch('/api/orders?id='+id,{method:'DELETE'});load()}}function show(src){$('big').src=src;$('viewer').style.display='flex'}$('q').oninput=render;$('filter').onchange=render;load();document.onkeydown=e=>{if(e.key==='Escape'){closeForm();$('viewer').style.display='none'}};
</script></body></html>
